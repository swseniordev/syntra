[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "syntra-backend"
version = "0.1.0"
description = "API modular inicial de Syntra"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "argon2-cffi>=25,<27",
  "PyJWT[crypto]>=2.10,<3.0",
  "google-re2>=1.1.20251105,<2.0",
  "openpyxl>=3.1,<4.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1.0", "pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
