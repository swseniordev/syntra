[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "syntra-worker"
version = "0.1.0"
description = "Worker independiente de Syntra para correo y exportaciones aprobadas"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2,<4.0",
  "argon2-cffi>=25,<27",
  "openpyxl>=3.1,<4.0",
  "apify-client>=1.7,<2.0",
  "numpy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[project.scripts]
syntra-worker = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]
