      description: |-
        **Qué hace:** Calcula las tareas elegidas sobre el alcance: sentimiento, clusters/subclusters, temas, cruces y bots.

        **Cómo lo hace:** Orquesta subprocesos: (1) sentimiento por LLM en lotes con pool de llaves; (2) embeddings faltantes (se reutilizan los ya calculados); (3) clustering K-means jerárquico con los # de la medición (y por grupo de preclustering si aplica); (4) etiquetado de clusters y temas con LLM sobre muestras representativas; (5) cruces con Aho-Corasick; (6) bots por reglas SQL. Escritura por staging + UPDATE … FROM.

