  /historico/archivar:
    post:
      operationId: hisArchivar
      tags:
      - Histórico
      summary: hisArchivar · Ejecuta el archivado
      description: |-
        **Qué hace:** Lanza a mano el archivado que el planificador corre el día 1 de cada mes (o simula qué movería).

        **Cómo lo hace:** Proceso «archivado» en q.mantenimiento. Por hoja (4 en paralelo): 1) toma el candado de la medición (si hay un proceso corriendo, la salta y reintenta luego); 2) asegura el año en la histórica; 3) COPY binario de las 11 tablas dat.* de esa hoja hacia la histórica en UNA transacción allá; 4) verifica conteo y suma de registro_id por tabla; 5) marca la huella como «h»; 6) DETACH PARTITION CONCURRENTLY + DROP en la principal (sin DELETE masivo, sin bloat). Cada paso queda en ops.archivado: si se cae, retoma donde iba.

        **Permiso:** `procesos:ejecutar` · **Tipo:** asíncrono (202) · **SLA:** Batch nocturno; medido: 310k filas copiadas en 6 s y la hoja soltada en 1,3 s (2 vCPU)
      parameters:
      - name: Idempotency-Key
        in: header
        schema:
          type: string
          minLength: 16
          maxLength: 128
        description: Clave única para la operación lógica; reutilizarla al
          reintentar la misma solicitud.
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                corte:
                  type: integer
                  description: AAAAMM; por defecto ops.fn_corte_archivo()
                medicion_ids:
                  type: array
                  items:
                    type: integer
                simular:
                  type: boolean
                  default: false
      responses:
        '202':
          $ref: '#/components/responses/Aceptado'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
      x-permiso: procesos:ejecutar
      x-modo: asincrono
