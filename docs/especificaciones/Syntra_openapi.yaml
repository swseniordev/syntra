      x-modo: sincrono
    patch:
      operationId: medEditar
      tags:
      - Mediciones
      summary: medEditar · Edita la medición
      description: |-
        **Qué hace:** Actualiza solo los campos enviados.

        **Cómo lo hace:** Compara If-Match, aplica el cambio, guarda actualizado_por/en y registra antes/después en auditoría. Si el cambio afecta datos ya procesados, propone el proceso de reaplicación correspondiente.

        **Permiso:** `mediciones:editar` · **Tipo:** síncrono

        **Concurrencia:** requiere `If-Match`; si no se envía, responde 428. Si el ETag ya cambió, responde 412.
