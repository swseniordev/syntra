      description: |-
        **Qué hace:** Horas de audio por hora de los últimos 15 min, cola pendiente y tiempo estimado para vaciarla.

        **Cómo lo hace:** Promedio de segundos_proceso vs duracion_s en dat.registro_transcripcion + profundidad de q.transcripcion. Insumo para decidir si encender una segunda GPU.

        **Tipo:** síncrono

