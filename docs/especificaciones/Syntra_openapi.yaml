  /scrapers/{id}/ejecutar:
    post:
      operationId: scrEjecutar
      tags:
      - Scrapers
      summary: scrEjecutar · Ejecuta ahora
      description: |-
        **Qué hace:** Lanza el scraping: una tarea por red (Apify) y una por país (Google News), en paralelo.

        **Cómo lo hace:** Crea prc.proceso + prc.proceso_tarea (red:x, red:tiktok…, pais:MX…) y encola en q.apify. Cada tarea arranca la corrida del actor con reintentos (ops.politica_reintento «apify.run»), recibe el webhook de Apify al terminar, lee el dataset en páginas paralelas, guarda el crudo en S3, normaliza y carga con COPY → staging → INSERT deduplicado. Al cerrar aplica «Al incorporar», actualiza métricas de posts existentes si se pidió y encadena transcripción/análisis.

        **Permiso:** `mediciones:ejecutar` · **Tipo:** asíncrono (202) · **SLA:** ingesta interna ≤ 2 min por 100k resultados (el tiempo del actor en Apify es externo)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Identificador
      - name: Idempotency-Key
        in: header
        schema:
          type: string
          minLength: 16
          maxLength: 128
        description: Clave única para la operación lógica; reutilizarla al
          reintentar la misma solicitud.
        required: true
      requestBody:
        required: true
