        '200':
          description: Marcados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarcarOut'
        '202':
          $ref: '#/components/responses/Aceptado'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
      x-permiso: fiscalizacion:editar
      x-modo: sincrono
  /mediciones/{id}/fiscalizacion/evaluar-ia:
    post:
      operationId: fisEvaluarIa
      tags:
      - Fiscalización
      summary: fisEvaluarIa · Evalúa relevancia con IA
      description: |-
        **Qué hace:** Evalúa con LLM los registros del universo filtrado (opcionalmente con un prompt distinto) y, si se pide, aplica el resultado.

        **Cómo lo hace:** Proceso q.llm: chunks de registros → lotes de N registros por llamado (cfg.llm_modelo.registros_por_llamado) → pool de llaves con limitador RPM/TPM en memoria de cada worker de q.llm (la cuota de cada llave se reparte entre los workers vivos de ops.worker) → reintentos → respaldo Gemini → error en registro. Resultados por COPY a staging y UPDATE … FROM. Tokens por llamado y por registro.

        **Permiso:** `fiscalizacion:ejecutar` · **Tipo:** asíncrono (202) · **SLA:** 100k: ~2 min de LLM + < 1 min de escritura · 1M: ≤ 10 min (requiere tier Grow)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Identificador
      - name: Idempotency-Key
        in: header
        schema:
          type: string
          minLength: 16
          maxLength: 128
        description: Clave única para la operación lógica; reutilizarla al
          reintentar la misma solicitud.
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluarIaIn'
      responses:
        '202':
          $ref: '#/components/responses/Aceptado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
      x-permiso: fiscalizacion:ejecutar
      x-modo: asincrono
  /mediciones/{id}/fiscalizacion/incorporar:
    post:
      operationId: fisIncorporar
      tags:
      - Fiscalización
      summary: fisIncorporar · Incorpora los que cumplen
      description: |-
        **Qué hace:** Incorpora a la medición todos los registros marcados como cumple que no estén incorporados.

        **Cómo lo hace:** UPDATE set-based en registro_estado; luego encadena el análisis según la configuración «Al incorporar» de cada lote.

        **Permiso:** `fiscalizacion:ejecutar` · **Tipo:** asíncrono (202) · **SLA:** 100k < 30 s
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Identificador
      - name: Idempotency-Key
        in: header
        schema:
          type: string
