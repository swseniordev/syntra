components:
  securitySchemes:
    bearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access token RS256 de 15 min (Authorization: Bearer …).'
    firmaWebhook:
      type: apiKey
      in: header
      name: X-Syntra-Webhook-Secret
      description: Secreto compartido configurado en el webhook de Apify.
    tokenServicio:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT de servicio (aud = gpu) firmado por la API; solo dentro
        de la VPC.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh
      description: Cookie de refresh HttpOnly; Secure; SameSite=Strict. Nunca
        leer ni guardar desde JavaScript.
  responses:
    Validacion:
      description: Validación fallida
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    NoAutenticado:
      description: Sin token o token vencido
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    Prohibido:
      description: Sin permiso o la cuenta no está en tus grupos
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    NoEncontrado:
      description: No existe o no es visible para ti
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    Conflicto:
      description: Conflicto (p. ej. ya hay un proceso del mismo tipo en curso
        para esta medición)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    VersionCambio:
      description: El recurso cambió desde que lo leíste (If-Match no coincide)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    Limite:
      description: Demasiadas solicitudes (límite por usuario)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    Aceptado:
      description: 'Aceptado: proceso creado y encolado'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProcesoAceptado'
      headers:
        Location:
          schema:
            type: string
          description: URL del proceso
    PrecondicionRequerida:
      description: Falta el encabezado If-Match requerido para controlar
        concurrencia.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Precondition Required
            status: 428
            detail: Debe enviar el ETag actual en If-Match.
  schemas:
    Problema:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        codigo:
          type: string
          description: Código estable para el frontend, p. ej.
            MEDICION_PROCESO_EN_CURSO
        errores:
          type: array
          items:
            type: object
            properties:
              campo:
                type: string
              mensaje:
                type: string
          description: Errores de validación por campo
        request_id:
          type: string
      required:
      - title
