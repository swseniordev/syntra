        **Cómo lo hace:** Workers en paralelo leen el texto por chunks (keyset), evalúan todas las regex con RE2 y los cruces con Aho-Corasick, escriben coincidencias por COPY y hacen el upsert: nuevas → INSERT, quitadas → activo = false, existentes → se validan y actualizan versión.

