      tags:
      - Auditoría
      summary: Enlace temporal de descarga del XLSX de Auditoría
      description: |-
        Exige Bearer JWT, `auditoria:ver`, proceso completado y usuario creador.
        Devuelve un enlace vinculado a la sesión con vigencia máxima de 15 minutos.
        La firma se entrega en una cookie `Secure`, `HttpOnly`, `SameSite=Strict`
        limitada a la ruta del archivo; no aparece en la URL ni en los access logs.
        El archivo final se conserva hasta 7 días; después responde 410.
      parameters:
      - name: proceso_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Enlace temporal de descarga
          content:
            application/json:
              schema:
                type: object
                required: [url, expira_en]
                properties:
                  url:
                    type: string
                  expira_en:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '410':
          description: Archivo vencido
      x-permiso: auditoria:ver
      x-modo: sincrono
