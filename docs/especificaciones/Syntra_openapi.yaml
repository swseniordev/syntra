        **Cómo lo hace:** UPDATE en contenido y/o estado + editado = true + auditoría (antes/después). Si cambia el texto, invalida embedding y regex de ese registro.

        **Permiso:** `registros:editar` · **Tipo:** síncrono

        **Concurrencia:** requiere `If-Match`; si no se envía, responde 428. Si el ETag ya cambió, responde 412.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Identificador
      - name: If-Match
        in: header
        schema:
          type: string
        description: ETag devuelto por la última lectura. Obligatorio para
          evitar sobrescribir cambios concurrentes.
