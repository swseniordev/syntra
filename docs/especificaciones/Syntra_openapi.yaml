  /llm/llaves/{id}:
    get:
      operationId: llmLlaveVer
      tags:
      - LLM
      summary: llmLlaveVer · Detalle de la llave
      description: |-
        **Qué hace:** Devuelve la llave con su ETag.

        **Cómo lo hace:** Lectura por PK; ETag = hash de actualizado_en para control de concurrencia en PATCH.

        **Permiso:** `llm:ver` · **Tipo:** síncrono
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Identificador
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmLlave'
          headers:
            ETag:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
      x-permiso: llm:ver
      x-modo: sincrono
    patch:
      operationId: llmLlaveEditar
      tags:
      - LLM
      summary: llmLlaveEditar · Edita la llave
      description: |-
        **Qué hace:** Actualiza solo los campos enviados.

        **Cómo lo hace:** Compara If-Match, aplica el cambio, guarda actualizado_por/en y registra antes/después en auditoría. Si el cambio afecta datos ya procesados, propone el proceso de reaplicación correspondiente.

        **Permiso:** `llm:editar` · **Tipo:** síncrono

        **Concurrencia:** requiere `If-Match`; si no se envía, responde 428. Si el ETag ya cambió, responde 412.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Identificador
      - name: If-Match
        in: header
        schema:
          type: string
        description: ETag devuelto por la última lectura. Obligatorio para
          evitar sobrescribir cambios concurrentes.
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmLlavePatch'
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmLlave'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '412':
          $ref: '#/components/responses/VersionCambio'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '428':
          $ref: '#/components/responses/PrecondicionRequerida'
      x-permiso: llm:editar
      x-modo: sincrono
    delete:
      operationId: llmLlaveEliminar
      tags:
      - LLM
      summary: llmLlaveEliminar · Elimina la llave (lógico)
      description: |-
        **Qué hace:** Pasa el estado a −1; no borra físicamente.

        **Cómo lo hace:** UPDATE estado_id = −1 + auditoría. Valida dependencias (p. ej. un rol con usuarios no se puede eliminar).

        **Permiso:** `llm:eliminar` · **Tipo:** síncrono
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Identificador
      responses:
        '204':
          description: Eliminado
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
      x-permiso: llm:eliminar
      x-modo: sincrono
