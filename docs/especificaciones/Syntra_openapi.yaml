        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignarIn'
      responses:
        '201':
          description: Reserva y ruta autenticada de carga
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Presignado'
        '409':
          description: Archivo idéntico existente u otro conflicto de reserva.
          content:
            application/json:
