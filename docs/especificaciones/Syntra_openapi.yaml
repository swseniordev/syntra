      tags:
      - Registros
      summary: regTranscribir · Transcribe este registro ahora
      description: |-
        **Qué hace:** Transcripción bajo demanda desde el visor del registro.

        **Cómo lo hace:** Encola la tarea con prioridad 1 (se adelanta a los lotes). Un video corto (< 2 min) suele estar listo en segundos; el visor recibe el aviso por SSE.

