    post:
      operationId: hisRehidratar
      tags:
      - Histórico
      summary: hisRehidratar · Trae un mes de vuelta a la principal
      description: |-
        **Qué hace:** Para reprocesar datos viejos (regex, IA, métricas), copia el mes desde el histórico a la principal.

        **Cómo lo hace:** Proceso «rehidratacion»: ops.fn_asegurar_periodos crea la hoja, COPY desde la histórica, huella → «p» y ops.archivado = rehidratado. El próximo archivado lo vuelve a mover.

        **Permiso:** `procesos:ejecutar` · **Tipo:** asíncrono (202)
      parameters:
      - name: Idempotency-Key
        in: header
        schema:
          type: string
          minLength: 16
          maxLength: 128
        description: Clave única para la operación lógica; reutilizarla al
          reintentar la misma solicitud.
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                medicion_id:
                  type: integer
                periodo:
                  type: integer
              required:
              - medicion_id
              - periodo
      responses:
        '202':
          $ref: '#/components/responses/Aceptado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
      x-permiso: procesos:ejecutar
      x-modo: asincrono
