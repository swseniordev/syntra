        **Qué hace:** Reserva un archivo y entrega la ruta autenticada para cargarlo en el almacenamiento local configurable de desarrollo.

        **Cómo lo hace:** Registra med.archivo, valida formato y tamaño (1 byte a 50 MB) y permite el PUT del contenido durante 15 minutos. La huella SHA-256 se calcula al recibirlo; el índice único impide duplicados en la misma medición. La abstracción de almacenamiento permite adaptar S3 posteriormente.

        **Permiso:** `mediciones:ejecutar` · **Tipo:** síncrono
