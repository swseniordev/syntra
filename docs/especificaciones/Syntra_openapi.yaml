        description: Solo red privada (VPC). No se publica a internet.
      security:
      - tokenServicio: []
      x-politica-autorizacion: token_servicio_gpu
  /salud:
    get:
      operationId: sisSalud
      tags:
      - Sistema
      summary: sisSalud · Salud
      description: |-
        **Qué hace:** Estado de PostgreSQL (principal, réplica, histórico), S3, profundidad de colas, workers vivos, servidor GPU y circuitos de proveedores.

        **Cómo lo hace:** Chequeos con timeout corto; usado por el balanceador y el monitoreo.

        **Tipo:** síncrono

