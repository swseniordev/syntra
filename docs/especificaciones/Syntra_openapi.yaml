  /hooks/apify:
    post:
      operationId: hokApify
      tags:
      - Webhooks
      summary: hokApify · Fin de corrida de Apify
      description: |-
        **Qué hace:** Apify avisa que una corrida terminó (éxito, fallo o timeout).

        **Cómo lo hace:** Verifica el secreto del webhook, busca la tarea por ref_externa (run id) y encola la lectura del dataset; responde 204 en < 100 ms. Si el webhook no llega, un sondeo de respaldo revisa corridas abiertas cada minuto.

        **Tipo:** síncrono

        **Política de autorización:** Validar secreto/firma del webhook y verificar idempotencia del evento recibido.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
