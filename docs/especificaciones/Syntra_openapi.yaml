openapi: 3.1.0
info:
  title: Syntra API
  version: 1.0.0-borrador
  description: |-
    Contrato de la API de **Syntra** (React ⇄ FastAPI). Es la hoja de ruta para implementar: cada operación dice **qué hace**, **cómo lo hace**, el **permiso** que exige y si es **síncrona** o **asíncrona**.

    ## Nombres mnemotécnicos
    `operationId` = **módulo (3 letras) + Verbo**. Así el nombre dice dónde vive y qué hace, y es el mismo en el backend (función del router), en el cliente generado del frontend y en los logs.

    | Prefijo | Módulo | Prefijo | Módulo |
    |---|---|---|---|
    | `aut` | Autenticación | `med` | Mediciones |
    | `usr` | Usuarios | `scr` | Scrapers |
    | `rol` | Roles | `car` | Cargas |
    | `grp` | Grupos | `fis` | Fiscalización |
    | `cli` | Clientes | `reg` | Registros |
    | `cta` | Cuentas | `prc` | Procesamiento |
    | `prm` | Prompts | `pro` | Procesos |
    | `cru` | Cruces | `evt` | Eventos (SSE) |
    | `rgx` | Regex | `inf` | Informes |
    | `pai` | Países | `aud` | Auditoría |
    | `act` | Actores | `ntf` | Notificaciones |
    | `fmt` | Formatos | `hok` | Webhooks |
    | `llm` | LLM | `ops` · `sis` · `cat` | Operación · Sistema · Catálogos |
    | `his` | Histórico | `gpu` | Servicio GPU (interno) |

    Verbos fijos: **Listar · Ver · Crear · Editar · Eliminar** (lógico) **· Restaurar · Estado** (activar/inactivar) **· Historial · Ejecutar · Probar · Exportar · Importar**. Ejemplos: `scrEjecutar`, `fisMarcar`, `prcReaplicarRegex`, `infExportar`.

    Rutas: sustantivos en plural y acciones como sub-ruta en verbo (`/scrapers/{id}/ejecutar`). No se usa `{id}:accion` porque el convertidor de rutas de FastAPI/Starlette tomaría `:accion` como parte del id.

    ## Seguridad (JWT)
    - `POST /auth/login` → **access token** RS256 de 15 min (en memoria del navegador, nunca en localStorage) + **refresh** rotativo en cookie `HttpOnly; Secure; SameSite=Strict`.
    - El token lleva `rol`, `ver_todas`, un hash de permisos y `ver` (versión del usuario). Si cambian los permisos o se cierra sesión en todos lados, sube la versión y los tokens viejos dejan de servir.
    - Cada endpoint declara `x-permiso` (`modulo:accion`). Además, **todo** acceso a datos de una medición valida que su cuenta esté en las cuentas visibles del usuario (`seg.v_usuario_cuenta`, en caché de memoria de cada proceso API por 60 s e invalidada con `NOTIFY`).

    ## Patrón asíncrono (cargas y procesamiento)
    1. El frontend llama, p. ej., `POST /scrapers/{id}/ejecutar` con `Idempotency-Key`.
    2. La API valida, crea la fila en `prc.proceso` (+ `prc.proceso_tarea` por red/país/archivo/chunk), encola y responde **202** con `proceso_id` en < 200 ms.
    3. Los workers toman las tareas de su cola en PostgreSQL (`FOR UPDATE SKIP LOCKED`; `LISTEN/NOTIFY` para despertar) y escriben el avance en `prc.proceso`. No hay Redis.
    4. El navegador escucha `GET /eventos` (SSE): solo actualiza la barra de progreso y el contador de la campana. **No recarga la vista**; si cambian datos visibles, muestra el aviso «Datos nuevos · actualizar vista».
    5. Si algo falla: reintento según `ops.politica_reintento`, respaldo de proveedor si aplica, y el registro queda con `st_<paso> = 3` + detalle en `dat.registro_evento`. `POST /procesos/{id}/reintentar-fallidos` vuelve a lanzar solo lo fallido.

    ## Convenciones
    - Paginación por **cursor** (keyset): `?cursor=…&limite=25`. Nada de `OFFSET` sobre millones de filas.
    - Errores en **RFC 9457** (`application/problem+json`) con `codigo` estable para el frontend.
    - Edición con **`If-Match`** (ETag) → 412 si otro usuario cambió el recurso.
    - Datos en la BD principal: mes en curso + 3 anteriores. Lo anterior se consulta con `alcance=historico` (solo lectura).
    - Eliminación siempre **lógica** (`estado_id = -1`) y restaurable; todo cambio queda en auditoría con antes/después.
    - Fechas en ISO 8601 con zona; la BD guarda `timestamptz`.


    ## Nota de implementación del contrato corregido
    Las extensiones `x-permiso`, `x-politica-autorizacion`, `x-modo`, `x-cliente-sse` y `x-event-schema` documentan políticas; FastAPI no las aplica automáticamente. El backend debe hacer cumplir autenticación, autorización, idempotencia y concurrencia, y las pruebas deben verificarlo. Los esquemas `*Patch` permiten campos parciales; los esquemas `*In` originales conservan sus reglas de creación.
servers:
- url: /api/v1
  description: Relativo al dominio de la API
security:
- bearerJWT: []
tags:
- name: Autenticación
  description: aut · Login, refresco y cierre de sesión con JWT. Access token
    corto (15 min) en memoria del navegador; refresh rotativo en cookie
    HttpOnly.
- name: Usuarios
  description: usr · Personas con acceso. El rol define qué pueden hacer; los
    grupos, qué cuentas ven.
- name: Roles
  description: rol · Matriz de permisos módulo × acción y alcance (todas las
    cuentas o por grupos).
- name: Grupos
  description: 'grp · Asocian usuarios con cuentas: un usuario sin rol global solo
    ve las cuentas de sus grupos.'
- name: Clientes
  description: cli · Organizaciones a las que Syntra presta el servicio.
- name: Cuentas
  description: cta · Unidad de monitoreo de un cliente; define prompts base de
    clusters y temas. Es la llave de partición de los datos.
- name: Prompts
  description: prm · Plantillas por defecto de clusters, temas, relevancia y
    sentimiento (generales o por red). Versionadas.
- name: Cruces
  description: cru · Listas de cuentas (@) y hashtags (#) cuya presencia se
    valida en cada registro.
- name: Regex
  description: rgx · Condiciones (RE2) para etiquetar, filtrar y preclasificar.
    Al crear o editar exigen un texto de prueba que debe cumplir.
- name: Países
  description: pai · Países para Google News (portal/edición local e idioma).
- name: Actores
  description: act · Actores de Apify por red (búsqueda y métricas), máximos por
    ejecución y memoria.
- name: Formatos
  description: fmt · Formatos de archivo aceptados y su mapeo de columnas →
    campos del registro (p. ej. DBFormatoSimple de 101 columnas).
- name: LLM
  description: llm · Proveedores (OpenAI principal, Gemini respaldo), modelos,
    llaves, consumo de tokens y llamados.
- name: Operación
  description: ops · Políticas de reintento, parámetros de operación, colas de
    trabajo y workers vivos (todo en PostgreSQL, sin Redis).
- name: Mediciones
  description: 'med · El corazón: configuración completa (fuentes, prompts, clusters,
    bots, regex, parámetros de X).'
- name: Scrapers
  description: 'scr · N procesos de scraping por medición: redes con cantidad por
    red, Google News por países, palabras por fuente, ejecución automática o manual.'
- name: Cargas
  description: car · Archivos (subida directa a S3), Meltwater, registro manual
    uno a uno; lotes e historial de archivos.
- name: Fiscalización
  description: 'fis · Revisión de relevancia: filtros (relevancia IA, regex, IA con
    prompt, texto), marcado individual o masivo, Excel de ida y vuelta e incorporación.'
- name: Registros
  description: 'reg · Todos los registros de la medición: ver, filtrar (incluye regex
    y estado por paso), editar, eliminar lógico, visor de la publicación.'
- name: Procesamiento
  description: 'prc · Ejecuciones sobre datos incorporados: análisis IA, métricas
    (metadata y transcripción), reaplicación de regex/cruces y publicación del tablero.'
- name: Procesos
  description: 'pro · Monitor de procesos: estado, tareas paralelas, log, cancelación
    y eventos en vivo (SSE).'
- name: Informes
  description: inf · Tablero e informes de la medición (desde agregados
    pre-calculados) y exportación Excel/PPTX/PDF.
- name: Auditoría
  description: aud · Log de auditoría de todo lo que pasa en la plataforma.
- name: Notificaciones
  description: ntf · Campana de notificaciones (solo sube el contador; no
    recarga la vista).
- name: Webhooks
  description: hok · Entradas de sistemas externos (sin JWT; firmadas).
- name: Histórico
  description: 'his · Archivado mensual: las hojas medición×mes más viejas que el
    mes en curso + 3 pasan a la BD histórica (PostgreSQL aparte, solo lectura).'
- name: Servicio GPU (interno)
  description: 'gpu · FastAPI del servidor GPU: atiende la cola q.transcripcion con
    Whisper local (faster-whisper). El frontend nunca lo llama; la API y el monitoreo
    sí.'
- name: Sistema
  description: sis · Salud y catálogos.
paths:
  /auth/login:
    post:
      operationId: autLogin
      tags:
      - Autenticación
      summary: autLogin · Inicia sesión
      description: |-
        **Qué hace:** Valida credenciales y entrega el access token; deja el refresh en cookie.

        **Cómo lo hace:** Verifica argon2id, crea seg.sesion (familia nueva) y firma el JWT RS256 con kid rotable. Bloqueo progresivo tras intentos fallidos (seg.usuario.intentos_fallidos / bloqueado_hasta) y límite por IP en el proxy (Caddy).

        **Tipo:** síncrono

        **Política de autorización:** Inicio de sesión con credenciales; aplicar limitación por IP y bloqueo progresivo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
          headers:
            Set-Cookie:
              schema:
                type: string
              description: refresh=…; HttpOnly; Secure; SameSite=Strict;
                Path=/api/v1/auth
        '429':
          $ref: '#/components/responses/Limite'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
      x-modo: sincrono
      security: []
      x-politica-autorizacion: publico
  /auth/refresh:
    post:
      operationId: autRefrescar
      tags:
      - Autenticación
      summary: autRefrescar · Renueva el access token
      description: |-
        **Qué hace:** Entrega un access token nuevo usando la cookie de refresh.

        **Cómo lo hace:** Rota el refresh: marca el anterior como usado y emite otro de la misma familia. Si llega un refresh ya usado, revoca toda la familia (posible robo).

        **Tipo:** síncrono

        **Autenticación:** requiere la cookie `refresh`; el navegador la envía automáticamente. No requiere access token en Authorization.

        **Política de autorización:** Exige cookie refresh válida, rotación de token y protección CSRF acorde a SameSite/Origin.
      responses:
        '200':
          description: Nuevo token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
      x-modo: sincrono
      security:
      - refreshCookie: []
      x-politica-autorizacion: cookie_refresh
  /auth/logout:
    post:
      operationId: autSalir
      tags:
      - Autenticación
      summary: autSalir · Cierra la sesión
      description: |-
        **Qué hace:** Revoca la sesión actual.

        **Cómo lo hace:** Marca seg.sesion.revocado_en y borra la cookie. «Cerrar todas» sube usuario.version_token y así invalida todos los JWT emitidos.

        **Tipo:** síncrono

        **Política de autorización:** Exige sesión autenticada; solo revoca la sesión propia salvo que se autorice explícitamente cerrar todas.
      parameters:
      - name: todas
        in: query
        schema:
          type: boolean
      responses:
        '204':
          description: Sesión cerrada
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
      x-modo: sincrono
      x-politica-autorizacion: sesion_autenticada
  /auth/yo:
    get:
      operationId: autYo
      tags:
      - Autenticación
      summary: autYo · Quién soy
      description: |-
        **Qué hace:** Devuelve usuario, rol, permisos, cuentas visibles y configuración de tarjetas.

        **Cómo lo hace:** Lee seg.v_usuario_cuenta (caché en memoria de cada proceso API por 60 s; se invalida al instante con NOTIFY seg_cambio) para que el frontend arme menú y filtros.

        **Tipo:** síncrono

        **Política de autorización:** Exige access token válido; solo devuelve la identidad y permisos del usuario autenticado.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Yo'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
      x-modo: sincrono
      x-politica-autorizacion: usuario_propio
  /auth/restablecer:
    post:
      operationId: autRestablecer
      tags:
      - Autenticación
      summary: autRestablecer · Restablece la contraseña
      description: |-
        **Qué hace:** Envía un enlace temporal de restablecimiento.

        **Cómo lo hace:** Token de un solo uso (24 h) firmado; respuesta idéntica exista o no el correo.

        **Tipo:** síncrono

        **Política de autorización:** No exige sesión; usa token temporal de un solo uso en el flujo de restablecimiento y respuesta indistinguible para correos existentes/no existentes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
              - email
      responses:
        '202':
          description: Si el correo existe, se envió el enlace
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
      x-modo: sincrono
      security: []
      x-politica-autorizacion: publico_token_temporal
  /usuarios:
    get:
      operationId: usrListar
      tags:
      - Usuarios
      summary: usrListar · Lista los usuarios
      description: "**Qué hace:** Devuelve los usuarios con búsqueda, filtro por estado
        (vigentes/activos/inactivos/eliminados) y paginación.\n\n**Cómo lo hace:**
        SELECT con índice parcial por estado_id y paginación por cursor (keyset);
        los eliminados (−1) solo aparecen si se piden. \n\n**Permiso:** `usuarios:ver`
        · **Tipo:** síncrono"
      parameters:
      - name: q
        in: query
        schema:
          type: string
        description: Texto libre
      - name: estado
        in: query
        schema:
          type: string
          enum:
          - vigentes
          - activos
          - inactivos
          - eliminados
        description: 'Por defecto: vigentes'
      - name: orden
        in: query
        schema:
          type: string
      - name: rol_id
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
        description: Cursor de la página siguiente
      - name: limite
        in: query
        schema:
          type: integer
          default: 25
          maximum: 200
      responses:
        '200':
          description: Página
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Pagina'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
      x-permiso: usuarios:ver
      x-modo: sincrono
    post:
      operationId: usrCrear
      tags:
      - Usuarios
      summary: usrCrear · Crea el usuario
      description: |-
        **Qué hace:** Registra el usuario activo y encola el correo con una contraseña temporal aleatoria. La respuesta 201 confirma el alta y el encolado, no la entrega del correo.

        **Cómo lo hace:** Valida unicidad (índice único parcial sobre estado_id ≠ −1), guarda creado_por/en y escribe en auditoría con el «después». El worker genera la contraseña, guarda solo su hash Argon2id y la envía por correo. Un fallo del proveedor queda auditado sin desactivar el usuario.

        **Permiso:** `usuarios:crear` · **Tipo:** síncrono
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioIn'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '409':
          $ref: '#/components/responses/Conflicto'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
      x-permiso: usuarios:crear
      x-modo: sincrono
  /usuarios/{id}:
    get:
      operationId: usrVer
      tags:
      - Usuarios
      summary: usrVer · Detalle de el usuario
      description: |-
        **Qué hace:** Devuelve el usuario con su ETag.

        **Cómo lo hace:** Lectura por PK; ETag = hash de actualizado_en para control de concurrencia en PATCH.

        **Permiso:** `usuarios:ver` · **Tipo:** síncrono
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Identificador
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
          headers:
            ETag:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
      x-permiso: usuarios:ver
      x-modo: sincrono
    patch:
      operationId: usrEditar
      tags:
      - Usuarios
      summary: usrEditar · Edita el usuario
      description: |-
        **Qué hace:** Actualiza solo los campos enviados.

        **Cómo lo hace:** Compara If-Match, aplica el cambio, guarda actualizado_por/en y registra antes/después en auditoría. Si el cambio afecta datos ya procesados, propone el proceso de reaplicación correspondiente.

        **Permiso:** `usuarios:editar` · **Tipo:** síncrono

        **Concurrencia:** requiere `If-Match`; si no se envía, responde 428. Si el ETag ya cambió, responde 412.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Identificador
      - name: If-Match
        in: header
        schema:
          type: string
        description: ETag devuelto por la última lectura. Obligatorio para
          evitar sobrescribir cambios concurrentes.
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioPatch'
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '412':
          $ref: '#/components/responses/VersionCambio'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '428':
          $ref: '#/components/responses/PrecondicionRequerida'
      x-permiso: usuarios:editar
      x-modo: sincrono
    delete:
      operationId: usrEliminar
      tags:
      - Usuarios
      summary: usrEliminar · Elimina el usuario (lógico)
      description: |-
        **Qué hace:** Pasa el estado a −1; no borra físicamente.

        **Cómo lo hace:** UPDATE estado_id = −1 + auditoría. Valida dependencias (p. ej. un rol con usuarios no se puede eliminar).

        **Permiso:** `usuarios:eliminar` · **Tipo:** síncrono
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Identificador
      responses:
        '204':
          description: Eliminado
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
      x-permiso: usuarios:eliminar
      x-modo: sincrono
  /usuarios/{id}/restaurar:
    post:
      operationId: usrRestaurar
      tags:
      - Usuarios
      summary: usrRestaurar · Restaura el usuario
      description: |-
        **Qué hace:** Recupera un elemento eliminado; queda inactivo para revisarlo antes de activarlo.

        **Cómo lo hace:** UPDATE estado_id = 0 + auditoría.

        **Permiso:** `usuarios:eliminar` · **Tipo:** síncrono
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Identificador
      responses:
        '200':
          description: Restaurado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
      x-permiso: usuarios:eliminar
      x-modo: sincrono
  /usuarios/{id}/estado:
    post:
      operationId: usrEstado
      tags:
      - Usuarios
      summary: usrEstado · Activa o inactiva el usuario
      description: |-
        **Qué hace:** Cambia entre activo (1) e inactivo (0).

        **Cómo lo hace:** UPDATE estado_id + auditoría «Cambio de estado».

        **Permiso:** `usuarios:editar` · **Tipo:** síncrono
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Identificador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                estado_id:
                  type: integer
                  enum:
                  - 1
                  - 0
              required:
              - estado_id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
      x-permiso: usuarios:editar
      x-modo: sincrono
  /usuarios/{id}/historial:
    get:
