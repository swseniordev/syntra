  /mediciones/{id}/procesamiento/transcribir:
    post:
      operationId: prcTranscribir
      tags:
      - Procesamiento
      summary: prcTranscribir · Transcribe videos y audios
      description: |-
        **Qué hace:** Transcribe con Whisper local los videos/audios del alcance (por defecto, los relevantes sin transcripción).

        **Cómo lo hace:** Crea tareas en q.media (descarga a S3 si falta y extracción de audio .opus 16 kHz con ffmpeg) y luego en q.transcripcion, que atiende el servidor GPU en lotes. El texto queda en dat.registro_transcripcion (con segmentos para subtítulos) y st_transcripcion por registro; si el registro estaba evaluado, se marca para re-evaluar relevancia.

        **Permiso:** `mediciones:ejecutar` · **Tipo:** asíncrono (202) · **SLA:** Capacidad, no SLA: ≈ 40–80 h de audio por hora por GPU RTX 4000 Ada (validar con prueba de carga)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Identificador
      - name: Idempotency-Key
        in: header
        schema:
          type: string
          minLength: 16
          maxLength: 128
        description: Clave única para la operación lógica; reutilizarla al
          reintentar la misma solicitud.
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                alcance:
                  $ref: '#/components/schemas/Alcance'
                solo_relevantes:
                  type: boolean
                  default: true
                idioma:
                  type: string
                  description: es por defecto; vacío = detectar
      responses:
        '202':
          $ref: '#/components/responses/Aceptado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
      x-permiso: mediciones:ejecutar
      x-modo: asincrono
  /registros/{id}/transcribir:
