      description: |-
        **Qué hace:** Marca como cumple / no cumple / pendiente la selección o todos los resultados del filtro.

        **Cómo lo hace:** Hasta 5 000 registros: UPDATE directo en registro_estado y respuesta 200. Más: proceso asíncrono por chunks (202). Si un incorporado pasa a «no cumple», sale del tablero (publicado = false). Auditoría «Actualización masiva».

        **Permiso:** `fiscalizacion:editar` · **Tipo:** síncrono (≤ 5 000) / asíncrono (202)
      parameters:
      - name: id
        in: path
        required: true
