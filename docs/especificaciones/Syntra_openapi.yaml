        **Cómo lo hace:** Crea un proceso y una tarea durable por archivo en q.ingesta, vinculados a cuenta y medición. La implementación inicial admite la ingesta de Talkwalker con su mapeo técnico; Meltwater y Plantilla Syntra quedan pendientes de mapeo. La fuente local es configurable y se sustituirá por un adaptador S3 cuando se apruebe su configuración.

        **Permiso:** `mediciones:ejecutar` · **Tipo:** asíncrono (202) · **Objetivos aprobados:** 100k filas ≤ 180 s · 1M ≤ 1799 s. El límite operativo por ejecución es 2100 s y no equivale al SLA.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Identificador
      - name: Idempotency-Key
        in: header
