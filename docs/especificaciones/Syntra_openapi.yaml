        **Cómo lo hace:** Revoca las sesiones activas, invalida tareas antiguas mediante version_token y encola una tarea q.notificaciones. El worker genera una contraseña aleatoria, almacena solo su hash Argon2id y envía el correo. La respuesta 202 confirma el encolado, no la entrega. No existe un flujo separado de invitaciones ni cambio obligatorio al primer acceso.

