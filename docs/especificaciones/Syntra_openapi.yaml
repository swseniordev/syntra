  /eventos:
    get:
      operationId: evtStream
      tags:
      - Procesos
      summary: evtStream · Eventos en vivo (SSE)
      description: |-
        **Qué hace:** Canal Server-Sent Events con progreso de procesos y notificaciones nuevas del usuario.

        **Cómo lo hace:** Cada proceso API mantiene una conexión LISTEN al canal evt de PostgreSQL. Los workers hacen pg_notify con un payload pequeño (máx. 1 por segundo por proceso). La API filtra por las cuentas visibles del usuario y reenvía con id para reanudar (Last-Event-ID). El frontend solo actualiza contadores y barras: no recarga la página.

        **Permiso:** `procesos:ver` · **Tipo:** stream (text/event-stream)

        **Cliente recomendado:** consumir con `fetch` y `Authorization: Bearer ...` y leer el stream; la API nativa `EventSource` no permite añadir esa cabecera. No enviar el JWT en la URL. Cada evento usa `id`, `event` y `data` (JSON compatible con el esquema `Evento`).
      parameters:
      - name: medicion_id
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: Stream
          content:
            text/event-stream:
              schema:
                type: string
                description: Flujo SSE en texto; cada evento contiene id, event
                  y data JSON.
              x-event-schema: '#/components/schemas/Evento'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
      x-permiso: procesos:ver
      x-modo: sincrono
      x-cliente-sse: fetch-stream-con-bearer-header
