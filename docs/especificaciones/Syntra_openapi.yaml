      tags:
      - Auditoría
      summary: audExportar · Exporta el log
      description: |-
        **Qué hace:** Excel del log filtrado.

        **Cómo lo hace:** Proceso q.reportes, una tarea por exportación. El XLSX
        se guarda en almacenamiento local privado durante el desarrollo.
        Idempotency-Key se vincula al usuario y a los filtros; la misma clave
        con filtros distintos responde 409.

        **Permiso:** `auditoria:ver` · **Tipo:** asíncrono (202)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                modulo:
                  type: string
                usuario_id:
                  type: integer
                  minimum: 1
                accion:
                  type: string
                entidad_tipo:
                  type: string
                entidad_id:
                  type: string
                desde:
                  type: string
                  format: date-time
                hasta:
                  type: string
                  format: date-time
                q:
                  type: string
      responses:
        '202':
          description: Proceso creado o recuperado por la misma Idempotency-Key.
          headers:
            Location:
              schema:
                type: string
              description: Ruta del proceso para seguimiento protegido.
          content:
            application/json:
              schema:
                type: object
                required: [proceso_id, tipo, estado]
                properties:
                  proceso_id:
                    type: integer
                  tipo:
                    type: string
                    enum: [exportacion]
                  estado:
                    type: string
                    enum: [en_cola, en_ejecucion, completado, advertencia, error, cancelado]
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '409':
          $ref: '#/components/responses/Conflicto'
      x-permiso: auditoria:ver
      x-modo: asincrono
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
