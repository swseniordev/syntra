      description: |-
        **Qué hace:** Redes, orígenes, estados de paso, pasos, tipos y estados de proceso, módulos y acciones.

        **Cómo lo hace:** Esquema cat (cacheable: ETag + Cache-Control 1 h).

        **Tipo:** síncrono

        **Política de autorización:** Requiere access token válido; devolver únicamente catálogos no sensibles.
      responses:
