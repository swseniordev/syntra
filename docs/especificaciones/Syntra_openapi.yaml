  /gpu/transcribir:
    post:
      operationId: gpuTranscribir
      tags:
      - Servicio GPU (interno)
      summary: gpuTranscribir · Transcribe un audio (prueba)
      description: |-
        **Qué hace:** Transcribe de forma síncrona un audio corto ya subido a S3 (≤ 120 s). Para pruebas y diagnóstico.

        **Cómo lo hace:** Descarga el objeto de S3 a disco local NVMe, ejecuta faster-whisper (large-v3-turbo, int8_float16, VAD) y devuelve texto + segmentos. No escribe en la BD.

        **Tipo:** síncrono

        **Política de autorización:** Solo JWT de servicio con audiencia gpu; limitar duración/tamaño del audio y validar la clave S3.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                s3_key:
                  type: string
                idioma:
                  type: string
