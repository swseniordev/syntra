  if (secs.includes('cruces') && Object.keys(d.pre).length) { h2('Preclustering por regex'); table(['Grupo (regex)', 'Registros', '% Positivo', '% Negativo', 'Neto'], [...m.regexIds.filter(id => d.pre[id]), ...(d.pre.none ? ['none'] : [])].map(id => srow(rxName(id), d.pre[id])), wd); }
  if (secs.includes('cruces')) { h2('Cruces: presencia de cuentas y hashtags'); table(['Lista / cuenta', 'Registros', '% Positivo', '% Negativo', 'Neto'], Object.values(d.cruces).flatMap(x => [srow(x.c.nombre, x), ...Object.entries(x.items).filter(([, p]) => p.t).map(([it, p]) => srow('   ' + it, p))]), wd); }
  if (secs.includes('bots') && m.bots && m.bots.activo) { h2('Análisis de bots'); table(['Indicador', 'Valor', '', '', ''], [['Cuentas bot', fmtN(d.botCuentas), '', '', ''], ['Menciones de bots', fmtN(d.bots), '', '', ''], ['RT de bots negativos', fmtN(d.rtNeg), '', '', ''], ['Bots negativos / positivos', `${fmtN(d.botP.neg)} / ${fmtN(d.botP.pos)}`, '', '', '']], wd); }
  if (secs.includes('autores')) { h2('Autores más activos'); table(['Autor', 'Menciones', 'Alcance', 'Bot', 'Neto'], d.topAut.map(a => [a.autor + ' (' + RED[a.red].n + ')', fmtN(a.t), fmtK(a.alcance), a.bot ? 'Sí' : 'No', (netSent(a) > 0 ? '+' : '') + fmtP(netSent(a), 0)]), wd); }
  const n = doc.getNumberOfPages(); for (let i = 1; i <= n; i++) { doc.setPage(i); doc.setFontSize(8); doc.setTextColor(122, 134, 154); doc.text(`Syntra · Confidencial · Página ${i} de ${n}`, W / 2, H - 22, { align: 'center' }); }
  doc.save(base + '.pdf');
}

/* ================= Inicio ================= */
route('/inicio', 'dashboard', () => {
  const u = me(); const h = new Date().getHours(); const saludo = h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches';
  const meds = visibleMediciones().filter(m => m.estadoId !== -1); const act = meds.filter(m => m.estadoId === 1); const mids = new Set(meds.map(m => m.id));
  const procs = S.procesos.filter(p => mids.has(p.medicionId)); const run = procs.filter(isRun);
  const stats = meds.map(m => ({ m, st: medStats(m).tot, a: pubAgg(m) }));
  const T = k => sum(stats.map(x => x.st[k]));
  const all = stats.flatMap(x => x.a.rows); const P = { pos: 0, neu: 0, neg: 0 }; all.forEach(r => P[r.sent]++);
  const d24 = procs.filter(p => p.fin && Date.now() - new Date(p.fin) < 864e5); const fin = procs.filter(p => !isRun(p) && p.estado !== 'cancelado'); const slaOk = fin.filter(p => p.simDur < SLA_MS).length;
  const nuevos24 = sum(d24.filter(p => p.tipo === 'carga').map(p => p.stats.n || 0));
  const ser = dailySeries(all, 21);
  const byO = {}; meds.forEach(m => { const st = medStats(m).by; ORIG_KEYS.forEach(o => byO[o] = (byO[o] || 0) + st[o].cargados); });
  const pend = stats.filter(x => x.st.pendFisc + x.st.porInc + x.st.pendAna + x.st.pendPub > 0).sort((a, b) => (b.st.pendFisc + b.st.porInc) - (a.st.pendFisc + a.st.porInc)).slice(0, 5);
  const feed = (can('auditoria') ? S.logs : []).slice(0, 6);
  return {
    title: 'Inicio', crumbs: [['', 'Inicio']],
    html: `<div class="hero-band"><div class="row wrap" style="gap:18px;align-items:center"><div class="grow"><h1>${saludo}, ${esc(u.nombre.split(' ')[0])}</h1><p>${run.length ? `Hay <b style="color:#fff">${run.length} proceso(s) en ejecución</b> · ` : ''}${act.length} mediciones activas${seesAll() ? '' : ' en tus grupos'} · <b style="color:#fff">${fmtN(T('pendFisc') + T('porInc'))}</b> registros por fiscalizar · <b style="color:#fff">${fmtN(T('pendAna'))}</b> por analizar.</p></div><div class="row wrap">${can('mediciones', 'crear') ? `<a class="btn primary" href="#/mediciones/nueva">${ic('plus', 16)} Nueva medición</a>` : ''}<a class="btn" href="#/mediciones">${ic('pulse', 16)} Mediciones</a><a class="btn" href="#/procesos">${ic('cycle', 16)} Procesos</a><button class="btn" data-act="palette">${ic('search', 16)} Buscar <kbd style="background:transparent;color:#fff;border-color:rgba(255,255,255,.3)">Ctrl K</kbd></button></div></div></div>
    ${restrictBanner()}
    <div class="grid g5 mb">
      <div class="card kpi hero"><div class="lbl">Registros cargados</div><div class="val">${fmtK(T('cargados'))}</div><div class="delta">${ic('arrowUp', 12, 3)} ${fmtN(nuevos24)} nuevos en 24 h · ${fmtN(T('dup'))} duplicados omitidos</div><div class="ico">${ic('upload')}</div></div>
      <div class="card kpi"><div class="lbl">Por fiscalizar</div><div class="val">${fmtN(T('pendFisc') + T('porInc'))}</div><div class="delta muted">${fmtN(T('desc'))} descartados por relevancia</div><div class="ico">${ic('scale')}</div></div>
      <div class="card kpi"><div class="lbl">Incorporados</div><div class="val">${fmtK(T('inc'))}</div><div class="delta muted">${fmtN(T('meta'))} con metadata · ${fmtN(T('trans'))} transcritos</div><div class="ico">${ic('check')}</div></div>
      <div class="card kpi"><div class="lbl">En tableros</div><div class="val">${fmtK(T('pub'))}</div><div class="delta muted">${fmtN(T('pendAna'))} sin analizar · ${fmtN(T('pendPub'))} sin publicar</div><div class="ico">${ic('chart')}</div></div>
      <div class="card kpi"><div class="lbl">SLA &lt; 15 min</div><div class="val">${fmtP(slaOk / (fin.length || 1) * 100, 0)}</div><div class="delta muted">${fin.length} ejecuciones · ${d24.length} en 24 h</div><div class="ico">${ic('clock')}</div></div>
    </div>
    <div class="grid g-2-1 mb"><div class="card"><div class="card-head"><h3>Conversación publicada · últimas 3 semanas</h3><span class="sub">neto ${netSent(P) > 0 ? '+' : ''}${fmtP(netSent(P))}</span><div class="right">${sentLegend()}</div></div><div class="card-body">${chartSlot(areaChart({ labels: ser.map(x => x.d), fmtL: d => `${pad(d.getDate())} ${MES[d.getMonth()]}`, series: ['neg', 'neu', 'pos'].map(k => ({ name: SENT[k].n, color: SENT[k].c, values: ser.map(x => x[k]) })) }), 250, 'Menciones diarias por sentimiento')}</div></div>
    <div class="card"><div class="card-head"><h3>Cargado por fuente</h3><span class="sub">quién incorporó</span></div><div class="card-body">${hbarList(ORIG_KEYS.filter(o => byO[o]).sort((a, b) => byO[b] - byO[a]).map(o => ({ label: ORIGENES[o].n, value: byO[o], color: 'var(--c1)', pre: ic(ORIGENES[o].ic, 13) + ' ', tt: `<div class="tt-h">${ORIGENES[o].n}</div>${fmtN(byO[o])} registros cargados` })), { fmtV: fmtK })}</div></div></div>
    <div class="grid g-2-1"><div class="card"><div class="card-head"><h3>Procesos recientes</h3><span class="sub">en vivo</span><div class="right"><a class="btn xs" href="#/procesos">Ver monitor</a></div></div>${procMini(procs.slice(0, 7))}</div>
    <div class="stack"><div class="card"><div class="card-head"><h3>Pendientes por medición</h3></div><div class="card-body" style="padding-top:6px">${pend.map(({ m, st }) => `<a href="#/mediciones/${m.id}" class="pend-row"><b class="grow" style="font-size:13px">${esc(m.nombre)}</b><span class="row wrap" style="gap:4px;justify-content:flex-end">${st.pendFisc + st.porInc ? `<span class="badge warn">${ic('scale', 11)} ${fmtN(st.pendFisc + st.porInc)}</span>` : ''}${st.pendAna ? `<span class="badge outline">${ic('layers', 11)} ${fmtN(st.pendAna)}</span>` : ''}${st.pendPub ? `<span class="badge info">${ic('chart', 11)} ${fmtN(st.pendPub)}</span>` : ''}</span></a>`).join('') || `<p class="muted">${ic('check', 14)} Todo al día.</p>`}<div class="legend mt-s" style="font-size:11.5px"><span>${ic('scale', 11)} por fiscalizar</span><span>${ic('layers', 11)} sin analizar</span><span>${ic('chart', 11)} sin publicar</span></div></div></div>
    ${feed.length ? `<div class="card"><div class="card-head"><h3>Actividad reciente</h3><div class="right"><a class="btn xs" href="#/auditoria">Auditoría</a></div></div><div class="card-body"><div class="timeline">${feed.map(l => `<div class="tl-item"><b>${esc(userName(l.usuarioId))}</b> <span class="muted">· ${esc(l.accion.toLowerCase())} · ${esc(l.modulo)}</span><p>${esc(l.entidad)} — ${rel(l.fecha)}</p></div>`).join('')}</div></div></div>` : ''}</div></div>`,
  };
});

boot();
</script>
